[project]
name = "medbuddy"
version = "0.1.0"
description = "Policy-bound outdoor weather advisory chatbot"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "pydantic>=2.8",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
