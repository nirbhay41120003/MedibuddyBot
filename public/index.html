<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Live, policy-bound outdoor safety advice" />
    <title>Weather Advisory Support Bot</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; background: #f4f7fb; color: #172033; }
      #mesh { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
      main { position: relative; z-index: 1; width: min(760px, calc(100% - 32px)); margin: 8vh auto; }
      .card { background: white; border: 1px solid #dce4ef; border-radius: 18px; box-shadow: 0 12px 35px #203a5d12; overflow: hidden; }
      header { padding: 28px 28px 20px; background: linear-gradient(135deg, #eaf5ff, #f9fbff); }
      h1 { margin: 0 0 8px; font-size: clamp(1.5rem, 4vw, 2.2rem); }
      header p { margin: 0; color: #53647a; }
      #messages { min-height: 240px; max-height: 55vh; overflow-y: auto; padding: 22px 28px; }
      .message { margin: 0 0 16px; padding: 12px 15px; border-radius: 13px; white-space: pre-wrap; line-height: 1.45; }
      .user { margin-left: 12%; background: #e6f0ff; }
      .assistant { margin-right: 12%; background: #f1f4f8; }
      form { display: flex; gap: 10px; padding: 18px 28px 24px; border-top: 1px solid #e8edf4; }
      input { min-width: 0; flex: 1; padding: 13px 14px; border: 1px solid #bdc9d8; border-radius: 10px; font: inherit; }
      button { padding: 0 20px; border: 0; border-radius: 10px; background: #1769d2; color: white; font: inherit; font-weight: 650; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      .note { padding: 0 28px 24px; color: #68788d; font-size: .88rem; }
    </style>
  </head>
  <body>
    <canvas id="mesh" aria-hidden="true"></canvas>
    <main>
      <section class="card">
        <header>
          <h1>⛅ Weather Advisory Support Bot</h1>
          <p>Live weather, policy-bound outdoor safety answers.</p>
        </header>
        <div id="messages" aria-live="polite">
          <div class="message assistant">Tell me what you plan to do and include a city, for example: “Is it safe to cycle in Bhopal today?”</div>
        </div>
        <form id="chat-form">
          <input id="prompt" autocomplete="off" placeholder="Ask about cycling, walking, travel…" required maxlength="2000" />
          <button id="send" type="submit">Ask</button>
        </form>
        <div class="note">Advice is limited to the reviewed safety policies and live Open-Meteo data.</div>
      </section>
    </main>
    <script>
      const sessionId = crypto.randomUUID();
      let contextLocation = null;
      let contextIntent = null;
      const messages = document.querySelector('#messages');
      const form = document.querySelector('#chat-form');
      const prompt = document.querySelector('#prompt');
      const send = document.querySelector('#send');

      function addMessage(role, content) {
        const node = document.createElement('div');
        node.className = `message ${role}`;
        node.textContent = content;
        messages.appendChild(node);
        messages.scrollTop = messages.scrollHeight;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const message = prompt.value.trim();
        if (!message) return;
        addMessage('user', message);
        prompt.value = '';
        send.disabled = true;
        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: sessionId, message, context_location: contextLocation, context_intent: contextIntent })
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.detail || 'The request failed.');
          contextLocation = payload.context_location || contextLocation;
          contextIntent = payload.context_intent || contextIntent;
          addMessage('assistant', payload.reply);
        } catch (error) {
          addMessage('assistant', `I couldn't reach the advisory service: ${error.message}`);
        } finally {
          send.disabled = false;
          prompt.focus();
        }
      });
    </script>
    <script>
      // Ambient node network background
      (() => {
        const canvas = document.getElementById('mesh');
        const context = canvas.getContext('2d');
        const INK = '#172033';
        const ACCENT = '#1769d2';
        const MUTED = '#53647a';
        const LABELS = ['weather', 'safety', 'outdoors', 'cycling', 'walking', 'travel', 'rain', 'wind', 'Bhopal', 'advice'];
        const EXTRA = ['today', 'city', 'heat', 'air', 'route', 'sun', 'cloud'];
        let width = 0;
        let height = 0;
        let dpr = 1;
        let points = [];
        let pulses = [];
        let rings = [];
        let mouse = { x: -10000, y: -10000 };
        let resizeTimer;
        const linkDistance = () => (width < 860 ? 120 : 160);

        function resize() {
          dpr = Math.min(window.devicePixelRatio || 1, window.innerWidth < 860 ? 1.5 : 2);
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = width * dpr;
          canvas.height = height * dpr;
          context.setTransform(dpr, 0, 0, dpr, 0, 0);
          const count = Math.round(width * height / (width < 860 ? 18000 : 19000));
          const litCount = Math.min(LABELS.length, width < 860 ? 6 : 9);
          const labels = LABELS.slice().sort(() => Math.random() - 0.5);
          points = Array.from({ length: count }, (_, index) => ({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.12,
            vy: (Math.random() - 0.5) * 0.12,
            r: 1.2 + Math.random() * 1.6,
            lit: index < litCount,
            label: index < litCount ? labels[index] : null,
            phase: Math.random() * Math.PI * 2
          }));
          points.sort(() => Math.random() - 0.5);
        }

        function sendLight(start, end) {
          const path = [start];
          let current = start;
          const seen = new Set([start]);
          for (let hop = 0; hop < 14 && current !== end; hop += 1) {
            let best = null;
            let bestDistance = Math.hypot(current.x - end.x, current.y - end.y);
            for (const point of points) {
              if (seen.has(point) || (!point.lit && point !== end)) continue;
              const distance = Math.hypot(current.x - point.x, current.y - point.y);
              if (distance > linkDistance() * 1.3) continue;
              const remaining = Math.hypot(point.x - end.x, point.y - end.y);
              if (remaining < bestDistance) { bestDistance = remaining; best = point; }
            }
            if (!best) break;
            path.push(best); seen.add(best); current = best;
          }
          if (path.length > 1) pulses.push({ path, index: 0, progress: 0 });
        }

        function physics() {
          for (const point of points) {
            point.x += point.vx; point.y += point.vy;
            if (point.x < -20) point.x = width + 20;
            if (point.x > width + 20) point.x = -20;
            if (point.y < -20) point.y = height + 20;
            if (point.y > height + 20) point.y = -20;
          }
          if (Math.random() < 0.035 && pulses.length < (width < 860 ? 4 : 7)) {
            const lit = points.filter((point) => point.lit);
            if (lit.length > 1) {
              const start = lit[Math.floor(Math.random() * lit.length)];
              const end = lit[(lit.indexOf(start) + 1 + Math.floor(Math.random() * (lit.length - 1))) % lit.length];
              sendLight(start, end);
            }
          }
          rings = rings.filter((ring) => (ring.progress += 0.018) < 1);
          for (let index = pulses.length - 1; index >= 0; index -= 1) {
            const pulse = pulses[index];
            const a = pulse.path[pulse.index];
            const b = pulse.path[pulse.index + 1];
            pulse.progress += 2.6 / Math.max(20, Math.hypot(a.x - b.x, a.y - b.y));
            if (pulse.progress >= 1) { pulse.progress = 0; pulse.index += 1; if (pulse.index >= pulse.path.length - 1) pulses.splice(index, 1); }
          }
        }

        function draw(now) {
          context.clearRect(0, 0, width, height);
          const offsetX = mouse.x - width / 2;
          const offsetY = mouse.y - height / 2;
          const gridSize = width < 860 ? 27 : 19;
          const gridX = -((offsetX * 0.016) % gridSize);
          const gridY = -((offsetY * 0.016) % gridSize);
          context.fillStyle = INK;
          for (let x = gridX - gridSize; x < width + gridSize; x += gridSize) {
            for (let y = gridY - gridSize; y < height + gridSize; y += gridSize) {
              const distance = Math.hypot(x - mouse.x, y - mouse.y);
              let drawX = x, drawY = y, alpha = 0.11, radius = 0.9;
              if (distance < 200 && distance > 0.1) { const force = 1 - distance / 200; drawX += (x - mouse.x) / distance * force * force * 20; drawY += (y - mouse.y) / distance * force * force * 20; alpha += force * 0.2; radius += force * 0.6; }
              context.globalAlpha = alpha; context.beginPath(); context.arc(drawX, drawY, radius, 0, Math.PI * 2); context.fill();
            }
          }
          context.globalAlpha = 1;
          const maxLink = linkDistance();
          for (let i = 0; i < points.length; i += 1) {
            const a = points[i];
            for (let j = i + 1; j < points.length; j += 1) {
              const b = points[j], distance = Math.hypot(a.x - b.x, a.y - b.y);
              if (distance > maxLink) continue;
              context.strokeStyle = a.lit && b.lit ? ACCENT : INK; context.globalAlpha = (1 - distance / maxLink) * (a.lit && b.lit ? 0.2 : 0.07); context.beginPath(); context.moveTo(a.x, a.y); context.lineTo(b.x, b.y); context.stroke();
            }
            const mouseDistance = Math.hypot(a.x - mouse.x, a.y - mouse.y);
            if (mouseDistance < maxLink * 1.1) { context.strokeStyle = ACCENT; context.globalAlpha = (1 - mouseDistance / (maxLink * 1.1)) * 0.3; context.beginPath(); context.moveTo(a.x, a.y); context.lineTo(mouse.x, mouse.y); context.stroke(); }
          }
          context.globalAlpha = 1;
          for (const pulse of pulses) {
            const a = pulse.path[pulse.index], b = pulse.path[pulse.index + 1];
            const x = a.x + (b.x - a.x) * pulse.progress, y = a.y + (b.y - a.y) * pulse.progress;
            context.strokeStyle = ACCENT; context.globalAlpha = 0.4; context.beginPath(); context.moveTo(a.x, a.y); context.lineTo(x, y); context.stroke(); context.globalAlpha = 0.12; context.beginPath(); context.moveTo(x, y); context.lineTo(b.x, b.y); context.stroke();
            const glow = context.createRadialGradient(x, y, 0, x, y, 14); glow.addColorStop(0, 'rgba(23,105,210,.65)'); glow.addColorStop(1, 'rgba(23,105,210,0)'); context.globalAlpha = 1; context.fillStyle = glow; context.beginPath(); context.arc(x, y, 14, 0, Math.PI * 2); context.fill(); context.fillStyle = ACCENT; context.beginPath(); context.arc(x, y, 2.6, 0, Math.PI * 2); context.fill();
          }
          for (const ring of rings) { context.strokeStyle = ACCENT; context.globalAlpha = (1 - ring.progress) * 0.55; context.lineWidth = 1.2; context.beginPath(); context.arc(ring.x, ring.y, 6 + ring.progress * 70, 0, Math.PI * 2); context.stroke(); }
          context.globalAlpha = 1; context.lineWidth = 1;
          for (const point of points) {
            const glow = 0.55 + 0.45 * Math.sin(now / 900 + point.phase);
            if (point.lit) { const halo = context.createRadialGradient(point.x, point.y, 0, point.x, point.y, 16); halo.addColorStop(0, `rgba(23,105,210,${0.25 * glow})`); halo.addColorStop(1, 'rgba(23,105,210,0)'); context.fillStyle = halo; context.beginPath(); context.arc(point.x, point.y, 16, 0, Math.PI * 2); context.fill(); context.fillStyle = ACCENT; context.globalAlpha = 0.6 + 0.4 * glow; context.beginPath(); context.arc(point.x, point.y, point.r + 0.6, 0, Math.PI * 2); context.fill(); context.font = '10px ui-monospace, monospace'; context.textAlign = 'left'; context.fillStyle = MUTED; context.globalAlpha = 0.45 + 0.3 * glow; context.fillText(point.label, point.x + 9, point.y + 3.5); } else { context.fillStyle = INK; context.globalAlpha = 0.22; context.beginPath(); context.arc(point.x, point.y, point.r, 0, Math.PI * 2); context.fill(); }
            context.globalAlpha = 1;
          }
        }

        function loop(now) { physics(); draw(now); requestAnimationFrame(loop); }
        window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 120); });
        window.addEventListener('mousemove', (event) => { mouse = { x: event.clientX, y: event.clientY }; });
        window.addEventListener('mouseleave', () => { mouse = { x: -10000, y: -10000 }; });
        document.addEventListener('pointerdown', (event) => {
          if (event.target.closest('a, button, input, textarea, form')) return;
          const used = new Set(points.filter((point) => point.label).map((point) => point.label));
          const label = [...LABELS, ...EXTRA].find((name) => !used.has(name)) || `point ${used.size + 1}`;
          const point = { x: event.clientX, y: event.clientY, vx: (Math.random() - 0.5) * 0.12, vy: (Math.random() - 0.5) * 0.12, r: 2.2, lit: true, label, phase: Math.random() * Math.PI * 2 };
          points.push(point); rings.push({ x: point.x, y: point.y, progress: 0 });
          points.filter((item) => item.lit && item !== point).sort((a, b) => Math.hypot(a.x - point.x, a.y - point.y) - Math.hypot(b.x - point.x, b.y - point.y)).slice(0, 2).forEach((near, index) => setTimeout(() => sendLight(near, point), 250 + index * 500));
        });
        resize(); requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>
